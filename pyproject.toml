[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Retrieval augmented generation on Azure AI Search and Azure OpenAI with document level security, offline evaluation and OpenTelemetry."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giselle Da Costa" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5.0,<7.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "azure-identity>=1.19,<2.0",
  "azure-search-documents>=11.5,<12.0",
  "openai>=1.55,<3.0",
  "opentelemetry-api>=1.28,<2.0",
  "opentelemetry-sdk>=1.28,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
monitor = ["azure-monitor-opentelemetry>=1.6,<2.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[project.scripts]
rag-eval = "rag.evaluation.cli:main"
rag-ingest = "rag.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.monitor.opentelemetry.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
  "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
source = ["rag"]
branch = true
