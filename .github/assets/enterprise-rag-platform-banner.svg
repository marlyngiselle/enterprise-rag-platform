<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise RAG Platform</title>
  <desc id="desc">Banner with the project name and an abstract drawing of documents, a vector space with a query point linked to its nearest neighbours, and a ranked result list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Documents -->
  <g transform="translate(668 78)" fill="none" stroke="#c7d7ff" stroke-width="1.5">
    <rect x="16" y="-10" width="84" height="108" rx="8" fill="#ffffff" fill-opacity="0.04" stroke-opacity="0.35"/>
    <rect x="8" y="-2" width="84" height="108" rx="8" fill="#ffffff" fill-opacity="0.06" stroke-opacity="0.55"/>
    <rect x="0" y="6" width="84" height="108" rx="8" fill="#0b1f4d" fill-opacity="0.55" stroke-opacity="0.9"/>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-linecap="round">
      <line x1="14" y1="26" x2="58" y2="26" stroke-width="3"/>
      <line x1="14" y1="42" x2="70" y2="42"/>
      <line x1="14" y1="52" x2="64" y2="52"/>
      <line x1="14" y1="62" x2="70" y2="62"/>
      <line x1="14" y1="78" x2="48" y2="78" stroke-width="3"/>
      <line x1="14" y1="92" x2="68" y2="92"/>
    </g>
    <g transform="translate(58 84)">
      <rect x="0" y="6" width="20" height="16" rx="3" fill="#2456c8" stroke="#ffffff" stroke-opacity="0.9"/>
      <path d="M4 6V2a6 6 0 0 1 12 0v4" stroke="#ffffff" stroke-opacity="0.9"/>
    </g>
  </g>

  <!-- Flow arrows -->
  <g stroke="#8fb3ff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
    <path d="M776 140 C 796 140, 800 150, 818 150"/>
    <path d="M1026 150 C 1040 150, 1044 140, 1060 140"/>
  </g>

  <!-- Vector space -->
  <g transform="translate(822 40)">
    <circle cx="100" cy="110" r="96" fill="url(#glow)"/>
    <circle cx="100" cy="110" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="100" cy="110" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.25">
      <line x1="100" y1="110" x2="132" y2="78"/>
      <line x1="100" y1="110" x2="62" y2="92"/>
      <line x1="100" y1="110" x2="128" y2="146"/>
    </g>
    <g fill="#c7d7ff" fill-opacity="0.45">
      <circle cx="30" cy="60" r="3"/>
      <circle cx="170" cy="58" r="3"/>
      <circle cx="40" cy="160" r="3"/>
      <circle cx="176" cy="150" r="3"/>
      <circle cx="96" cy="30" r="3"/>
      <circle cx="84" cy="188" r="3"/>
      <circle cx="18" cy="112" r="3"/>
      <circle cx="150" cy="190" r="3"/>
      <circle cx="186" cy="104" r="3"/>
    </g>
    <g fill="#ffffff">
      <circle cx="132" cy="78" r="5"/>
      <circle cx="62" cy="92" r="5"/>
      <circle cx="128" cy="146" r="5"/>
    </g>
    <circle cx="100" cy="110" r="9" fill="#2456c8" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="100" cy="110" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
  </g>

  <!-- Ranked results with citations -->
  <g transform="translate(1068 86)">
    <g fill="#ffffff">
      <rect x="0" y="0" width="112" height="14" rx="7" fill-opacity="0.9"/>
      <rect x="0" y="28" width="88" height="14" rx="7" fill-opacity="0.65"/>
      <rect x="0" y="56" width="64" height="14" rx="7" fill-opacity="0.45"/>
      <rect x="0" y="84" width="40" height="14" rx="7" fill-opacity="0.25"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0b1f4d">
      <text x="8" y="11">[1]</text>
      <text x="8" y="39">[2]</text>
      <text x="8" y="67">[3]</text>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="112" font-size="20" font-weight="600" letter-spacing="4" fill-opacity="0.7">AZURE AI FOUNDRY  ·  AZURE AI SEARCH</text>
    <text x="62" y="170" font-size="50" font-weight="700" letter-spacing="-1">Enterprise RAG Platform</text>
    <text x="64" y="212" font-size="22" font-weight="400" fill-opacity="0.85">Grounded answers. Secure by group. Evaluated in CI.</text>
  </g>
  <g transform="translate(64 236)">
    <rect x="0" y="0" width="56" height="4" rx="2" fill="#8fb3ff"/>
    <rect x="64" y="0" width="24" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="96" y="0" width="12" height="4" rx="2" fill="#ffffff" fill-opacity="0.3"/>
  </g>
</svg>
